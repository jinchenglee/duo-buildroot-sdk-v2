# A sample configuration for dhcpcd.
# See dhcpcd.conf(5) for details.

# Allow users of this group to interact with dhcpcd via the control socket.
#controlgroup wheel

# Inform the DHCP server of our hostname for DDNS.
#hostname

# Use the hardware address of the interface for the Client ID.
#clientid
# or
# Use the same DUID + IAID as set in DHCPv6 for DHCPv4 ClientID as per RFC4361.
# Some non-RFC compliant DHCP servers do not reply with this set.
# In this case, comment out duid and enable clientid above.
duid

# Persist interface configuration when dhcpcd exits.
persistent

# vendorclassid is set to blank to avoid sending the default of
# dhcpcd-<version>:<os>:<machine>:<platform>
vendorclassid

# A list of options to request from the DHCP server.
option domain_name_servers, domain_name, domain_search
option classless_static_routes
# Respect the network MTU. This is applied to DHCP routes.
option interface_mtu

# Request a hostname from the network
option host_name

# Most distributions have NTP support.
#option ntp_servers

# Rapid commit support.
# Safe to enable by default because it requires the equivalent option set
# on the server to actually work.
option rapid_commit

# A ServerID is required by RFC2131.
require dhcp_server_identifier

# Generate SLAAC address using the Hardware Address of the interface
#slaac hwaddr
# OR generate Stable Private IPv6 Addresses based from the DUID
slaac private

# usb0 is excluded upstream (buildroot/package/dhcpcd/0001-ignore-interface-usb0-for-duo.patch)
# so dhcpcd doesn't fight its static 192.168.42.1 USB-gadget address.
#
# wlan0 is excluded here, board-specific: with no AP configured it has no
# carrier, and dhcpcd's IPv4LL fallback self-assigns a 169.254.0.0/16
# link-local address. cvi_rtsp's live555 auto-selects "our IP" for the RTSP
# stream announcement from any UP interface with an address, and picks that
# useless one over usb0's real, host-reachable address -- breaking playback.
# The aic8800 driver leaves wlan0 down on its own; dhcpcd was the only thing
# bringing it up and re-asserting it (confirmed live: manually downing the
# interface didn't stick until dhcpcd stopped managing it). Denying it here
# means it just stays down. `ip link set wlan0 up` still works manually --
# dhcpcd won't touch it either way, so bring your own IP config if you need
# WiFi on this board.
denyinterfaces usb0 wlan0

# eth0 is still dhcpcd-managed (it's a real DHCP interface, unlike wlan0),
# but by default dhcpcd self-assigns a transient 169.254.0.0/16 link-local
# address the instant the link comes up, then replaces it once a real DHCP
# lease arrives seconds later. Any RTSP demo started (or `ifconfig` checked)
# during that window sees the same useless link-local address problem as
# wlan0 above, even with a fully working LAN. Confirmed live: with
# noipv4ll, eth0 has no address at all during negotiation and picks up its
# real DHCP lease once available -- no link-local ever appears, so live555
# can only pick usb0 in the meantime.
noipv4ll
